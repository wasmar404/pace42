services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pace42}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pace42}
      POSTGRES_DB: ${POSTGRES_DB:-pace42}
    ports:
      - "5432:5432"
    volumes:
      - pace42_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "3004"
      NODE_ENV: development
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-pace42}:${POSTGRES_PASSWORD:-pace42}@db:5432/${POSTGRES_DB:-pace42}
      DIRECT_URL: postgresql://${POSTGRES_USER:-pace42}:${POSTGRES_PASSWORD:-pace42}@db:5432/${POSTGRES_DB:-pace42}

      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}

      SUPABASE_AVATARS_BUCKET: ${SUPABASE_AVATARS_BUCKET:-avatars}
      SUPABASE_ACTIVITY_MEDIA_BUCKET: ${SUPABASE_ACTIVITY_MEDIA_BUCKET:-activity-media}
      SUPABASE_GPX_BUCKET: ${SUPABASE_GPX_BUCKET:-gpx}
      SUPABASE_IMPORT_GPX_FUNCTION: ${SUPABASE_IMPORT_GPX_FUNCTION:-import-gpx}
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3004}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:?set SUPABASE_URL in .env}}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./front_end:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pace42_db:
  backend_node_modules:
  frontend_node_modules:
