services:
  supabase:
    image: alpine:3.20
    working_dir: /work
    network_mode: host
    env_file:
      - ./.env
    command:
      - sh
      - -lc
      - |
        set -eu
        i=0
        until apk add --no-cache curl tar docker-cli ca-certificates; do
          i=$$((i + 1))
          if [ $$i -ge 15 ]; then
            echo "[supabase] apk add failed" >&2
            exit 1
          fi
          sleep 2
        done
        mkdir -p .bin
        if [ ! -x .bin/supabase ]; then
          arch=$$(uname -m)
          case "$$arch" in
            x86_64|amd64) tgz=supabase_linux_amd64.tar.gz ;;
            aarch64|arm64) tgz=supabase_linux_arm64.tar.gz ;;
            *) echo "unsupported arch: $$arch" >&2; exit 1 ;;
          esac
          url="https://github.com/supabase/cli/releases/latest/download/$$tgz"
          echo "[supabase] downloading $$url"
          curl -fsSL "$$url" -o .bin/supabase.tgz
          tar -xzf .bin/supabase.tgz -C .bin
          rm -f .bin/supabase.tgz
          chmod +x .bin/supabase
        fi
        echo "[supabase] restarting"
        ./.bin/supabase stop --no-backup || true
        ./.bin/supabase start
        ./.bin/supabase status
        tail -f /dev/null
    volumes:
      - ./:/work
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "54322"
    network_mode: host
    depends_on:
      - supabase
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    network_mode: host
    depends_on:
      - backend
    volumes:
      - ./front_end:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
