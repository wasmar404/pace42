events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS so upstream IP changes (container recreate)
    # don't require an nginx rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow larger uploads (GPX, photos). Keep in sync with backend limits.
    client_max_body_size 30m;

    # Only send Connection: upgrade when Upgrade is present.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect plain HTTP → HTTPS
    server {
        listen 3004;
        return 301 https://$host:3443$request_uri;
    }

    # Supabase (kong) HTTPS proxy for LAN/dev.
    # Frontend should use https://<host>:5443 as its SUPABASE URL.
    server {
        listen 5443 ssl;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Simple TLS check endpoint (no upstream, no API key)
        location = /health {
            add_header content-type application/json;
            return 200 '{"ok":true}';
        }

        # Avoid noisy browser requests hitting Kong.
        location = /favicon.ico { return 204; }
        location = /robots.txt { return 204; }

        location / {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    server {
        listen 3443 ssl;
        listen 5173 ssl;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Increase timeouts for long-lived WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Health check without hitting upstreams
        location = /health {
            add_header content-type application/json;
            return 200 '{"ok":true}';
        }

        # Backend API
        location ^~ /api/ {
            set $backend_upstream http://backend:3004;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # Socket.IO (chat)
        location ^~ /socket.io/ {
            set $backend_upstream http://backend:3004;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # Supabase (Kong) proxied through same origin to avoid extra cert prompts.
        location ^~ /auth/v1/ {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
        location ^~ /rest/v1/ {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
        location ^~ /storage/v1/ {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
        location ^~ /functions/v1/ {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
        location ^~ /realtime/v1/ {
            set $kong_upstream http://kong:8000;
            proxy_pass         $kong_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # Frontend (Vite dev server)
        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass         $frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }
}
