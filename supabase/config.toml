[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/verification",
  "http://127.0.0.1:5173/verification",
  "http://127.0.0.1:3000",
  "http://localhost:3000"
]

[auth.rate_limit]
# Local dev: allow lots of confirmation/resend emails without hitting 429.
# (Gmail itself still has its own sending limits.)
email_sent = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
# Dev-only: set low/zero to avoid local throttling.
# Note: this is NOT the same as Gmail's own sending limits.
max_frequency = "0s"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "Pace 42"

[auth.external.google]
enabled = true
client_id = "87751635631-a6vg3c67siatfkbn1d3355ogdh6i2aej.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
