[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/verification",
  "http://127.0.0.1:5173/verification",
  "http://127.0.0.1:3000",
  "http://localhost:3000"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations =  true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "Pace 42"

[auth.external.google]
enabled = true
client_id = "87751635631-a6vg3c67siatfkbn1d3355ogdh6i2aej.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
